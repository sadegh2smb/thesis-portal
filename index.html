<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پورتال جلسات و هدایت پایان‌نامه</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- کتابخانه رسمی Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- بخش ورود (Authentication) -->
  <div id="auth-section" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">پورتال پیگیری پایان‌نامه</h1>
        <p class="text-sm text-slate-500 mt-2">ورود مشترک استاد راهنما و دانشجو</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ایمیل کاربری</label>
          <input type="email" id="email" required dir="ltr" placeholder="example@gmail.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">رمز عبور</label>
          <input type="password" id="password" required dir="ltr" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">
          ورود به سامانه
        </button>
        <p id="auth-error" class="text-rose-500 text-xs text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- داشبورد اصلی (پس از ورود موفق) -->
  <div id="app-section" class="hidden">
    <!-- نوار بالا -->
    <header class="bg-white border-b sticky top-0 z-10">
      <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <h2 class="font-bold text-slate-800 text-lg">جلسات و پیشرفت پایان‌نامه</h2>
        </div>
        <div class="flex items-center gap-4">
          <span id="user-display" class="text-xs bg-slate-100 px-3 py-1.5 rounded-full text-slate-600 font-mono" dir="ltr"></span>
          <button onclick="handleLogout()" class="text-xs text-rose-600 hover:text-rose-700 font-medium">خروج</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- ستون ثبت جلسه جدید -->
      <div class="md:col-span-1">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm sticky top-24">
          <h3 class="font-bold text-slate-800 mb-4 pb-2 border-b">ثبت صورت‌جلسه جدید</h3>
          <form id="meeting-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">تاریخ جلسه</label>
              <input type="text" id="m-date" placeholder="۱۴۰۴/۰۸/۰۵" required class="w-full text-sm px-3 py-2 border rounded-lg outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">موضوع / محور گفتگو</label>
              <input type="text" id="m-title" placeholder="بررسی ادبیات تحقیق و مدل‌سازی" required class="w-full text-sm px-3 py-2 border rounded-lg outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">خلاصه گزارش و کارهای انجام‌شده</label>
              <textarea id="m-summary" rows="3" required placeholder="شرح کارهایی که تا این جلسه تکمیل شده..." class="w-full text-sm px-3 py-2 border rounded-lg outline-none focus:border-indigo-500"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">تکالیف و اهداف جلسه بعدی</label>
              <textarea id="m-tasks" rows="2" placeholder="موارد مشخص‌شده برای جلسه آینده..." class="w-full text-sm px-3 py-2 border rounded-lg outline-none focus:border-indigo-500"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">لینک فایل / پیش‌نویس (Google Drive، Overleaf و...)</label>
              <input type="url" id="m-link" dir="ltr" placeholder="https://..." class="w-full text-sm px-3 py-2 border rounded-lg outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="save-meeting-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-lg transition">
              ذخیره در دیتابیس آنلاین
            </button>
          </form>
        </div>
      </div>

      <!-- ستون تاریخچه جلسات -->
      <div class="md:col-span-2 space-y-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-slate-800">تاریخچه جلسات و ارزیابی‌ها</h3>
          <button onclick="fetchMeetings()" class="text-xs text-indigo-600 hover:underline">بروزرسانی لیست</button>
        </div>

        <div id="loading" class="text-center py-12 text-slate-400 text-sm">در حال دریافت داده‌ها...</div>
        <div id="meetings-list" class="space-y-4"></div>
      </div>
    </main>
  </div>

  <script>
    // اطلاعات اختصاصی پروژه و دسترسی دیتابیس Supabase
    const SUPABASE_URL = "https://lyawmmkqulaetesdcxzn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sE2ZYOMNRbaEUW7JTbwLCQ_-Yih9NBI";

    // ساخت کلاینت پایگاه داده
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');
    const userDisplay = document.getElementById('user-display');
    const meetingsList = document.getElementById('meetings-list');
    const loading = document.getElementById('loading');

    // بررسی وضعیت نشست کاربر
    async function checkUser() {
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) {
        showApp(session.user);
      } else {
        showAuth();
      }
    }

    function showAuth() {
      authSection.classList.remove('hidden');
      appSection.classList.add('hidden');
    }

    function showApp(user) {
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      userDisplay.innerText = user.email;
      fetchMeetings();
    }

    // ورود
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      
      btn.disabled = true;
      btn.innerText = 'در حال اعتبارسنجی...';
      authError.classList.add('hidden');

      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      btn.innerText = 'ورود به سامانه';

      if (error) {
        authError.innerText = 'اطلاعات ورود اشتباه است یا کاربر تعریف نشده است.';
        authError.classList.remove('hidden');
      } else {
        showApp(data.user);
      }
    });

    // خروج
    async function handleLogout() {
      await sbClient.auth.signOut();
      showAuth();
    }

    // دریافت لیست جلسات از دیتابیس آنلاین
    async function fetchMeetings() {
      loading.classList.remove('hidden');
      meetingsList.innerHTML = '';

      const { data: meetings, error } = await sbClient
        .from('meetings')
        .select('*')
        .order('created_at', { ascending: false });

      loading.classList.add('hidden');

      if (error) {
        meetingsList.innerHTML = `<p class="text-rose-500 text-xs">خطا در دریافت اطلاعات: ${error.message}</p>`;
        return;
      }

      if (!meetings || meetings.length === 0) {
        meetingsList.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 border border-dashed">هنوز جلسه‌ای ثبت نشده است. اولین جلسه را از فرم کناری ثبت کنید.</div>`;
        return;
      }

      meetings.forEach(m => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4";
        
        let statusBadge = m.status === 'تایید شده' 
          ? '<span class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-medium">تایید شده</span>'
          : (m.status === 'نیاز به اصلاحات' 
            ? '<span class="text-xs bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full font-medium">نیاز به اصلاحات</span>'
            : '<span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">در انتظار بررسی</span>');

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <span class="text-xs text-indigo-600 font-semibold">${m.meeting_date}</span>
              <h4 class="font-bold text-slate-900 text-base mt-1">${m.title}</h4>
            </div>
            ${statusBadge}
          </div>

          <div class="text-sm text-slate-600 whitespace-pre-line bg-slate-50 p-3 rounded-xl border border-slate-100">
            <strong class="text-slate-800 block text-xs mb-1">گزارش دانشجو:</strong>
            ${m.summary}
          </div>

          ${m.next_tasks ? `
            <div class="text-xs text-slate-600">
              <strong class="text-slate-700">تکالیف جلسه بعد:</strong> ${m.next_tasks}
            </div>` : ''}

          ${m.file_link ? `
            <div>
              <a href="${m.file_link}" target="_blank" class="inline-flex items-center gap-1 text-xs text-indigo-600 hover:underline">
                📄 مشاهده فایل یا پیش‌نویس ضمیمه‌شده
              </a>
            </div>` : ''}

          <!-- بخش بازخورد و تغییر وضعیت توسط استاد راهنما -->
          <div class="pt-3 border-t border-slate-100">
            <label class="block text-xs font-semibold text-slate-700 mb-1">بازخورد و وضعیت ارزیابی استاد راهنما:</label>
            <div class="flex flex-col gap-2">
              <textarea id="feedback-${m.id}" rows="2" placeholder="استاد محترم بازخورد و اصلاحات را در این قسمت وارد فرمایید..." 
                class="w-full text-xs p-2.5 border rounded-lg outline-none focus:border-indigo-500 bg-white">${m.prof_feedback || ''}</textarea>
              
              <div class="flex items-center justify-between">
                <select id="status-${m.id}" class="text-xs border rounded-lg px-2 py-1.5 bg-white text-slate-700 outline-none">
                  <option value="در انتظار بررسی" ${m.status === 'در انتظار بررسی' ? 'selected' : ''}>در انتظار بررسی</option>
                  <option value="تایید شده" ${m.status === 'تایید شده' ? 'selected' : ''}>تایید شده</option>
                  <option value="نیاز به اصلاحات" ${m.status === 'نیاز به اصلاحات' ? 'selected' : ''}>نیاز به اصلاحات</option>
                </select>

                <button onclick="saveFeedback('${m.id}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3 py-1.5 rounded-lg transition">
                  ثبت بازخورد استاد
                </button>
              </div>
            </div>
          </div>
        `;
        meetingsList.appendChild(card);
      });
    }

    // ثبت جلسه جدید
    document.getElementById('meeting-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-meeting-btn');
      btn.disabled = true;

      const user = (await sbClient.auth.getUser()).data.user;

      const newMeeting = {
        meeting_date: document.getElementById('m-date').value,
        title: document.getElementById('m-title').value,
        summary: document.getElementById('m-summary').value,
        next_tasks: document.getElementById('m-tasks').value,
        file_link: document.getElementById('m-link').value,
        author_email: user ? user.email : ''
      };

      const { error } = await sbClient.from('meetings').insert([newMeeting]);
      btn.disabled = false;

      if (error) {
        alert('خطا در ثبت: ' + error.message);
      } else {
        document.getElementById('meeting-form').reset();
        fetchMeetings();
      }
    });

    // ثبت بازخورد استاد
    async function saveFeedback(id) {
      const feedback = document.getElementById(`feedback-${id}`).value;
      const status = document.getElementById(`status-${id}`).value;

      const { error } = await sbClient
        .from('meetings')
        .update({ prof_feedback: feedback, status: status })
        .eq('id', id);

      if (error) {
        alert('خطا در ذخیره بازخورد: ' + error.message);
      } else {
        fetchMeetings();
      }
    }

    // بررسی ورود اولیه
    checkUser();
  </script>
</body>
</html>
