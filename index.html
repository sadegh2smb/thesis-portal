      const { defense } = store;
      const [newCheck, setNewCheck] = useState("");
      const [member, setMember] = useState({ name: "", role: "", contact: "" });

      const doneCount = defense.checklist.filter(c => c.done).length;
      const pct = defense.checklist.length ? Math.round((doneCount / defense.checklist.length) * 100) : 0;

      const updateDefense = (patch) => {
        updateStore(s => ({ ...s, defense: { ...s.defense, ...patch } }));
      };

      return (
        <div className="space-y-5">
          <div className="rounded-2xl bg-gradient-to-l from-slate-800 to-slate-900 p-6 text-white shadow-lg">
            <p className="text-sm text-slate-300 font-medium">🎓 برنامه‌ریزی و آمادگی جلسه دفاع</p>
            <div className="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <span className="mb-1 block text-xs text-slate-300">تاریخ دفاع (شمسی)</span>
                <JalaliDatePicker dark allowEmpty value={defense.date} onChange={d => updateDefense({ date: d })} />
              </div>
              <label className="block">
                <span className="mb-1 block text-xs text-slate-300">محل برگزاری / لینک جلسه</span>
                <input
                  value={defense.location}
                  onChange={e => updateDefense({ location: e.target.value })}
                  placeholder="مثلاً سالن دفاعیه دانشکده..."
                  className="w-full rounded-xl bg-white/10 px-3 py-2 text-sm text-white outline-none placeholder:text-slate-400"
                />
              </label>
            </div>
            <p className="mt-3 text-xs text-indigo-300">تاریخ انتخابی: {formatJalali(defense.date)}</p>
          </div>

          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="mb-3 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-800">چک‌لیست اقدامات قبل از دفاع</h3>
              <span className="text-sm font-bold text-indigo-600">{toFaDigits(pct)}٪</span>
            </div>
            <div className="mb-4 h-2.5 w-full overflow-hidden rounded-full bg-slate-100">
              <div className="h-full rounded-full bg-indigo-600 transition-all" style={{ width: `${pct}%` }} />
            </div>
            <ul className="mb-4 space-y-2">
              {defense.checklist.map(item => (
                <li key={item.id} className="flex items-center justify-between rounded-xl border border-slate-100 p-2.5">
                  <label className="flex items-center gap-2.5 cursor-pointer flex-1">
                    <input
                      type="checkbox"
                      checked={item.done}
                      onChange={() => updateDefense({
                        checklist: defense.checklist.map(c => c.id === item.id ? { ...c, done: !c.done } : c)
                      })}
                      className="size-4 accent-indigo-600"
                    />
                    <span className={`text-sm ${item.done ? "line-through text-slate-400" : "text-slate-700"}`}>{item.title}</span>
                  </label>
                  <button
                    onClick={() => updateDefense({ checklist: defense.checklist.filter(c => c.id !== item.id) })}
                    className="text-rose-400 hover:text-rose-600 text-xs"
                  >
                    🗑️
                  </button>
                </li>
              ))}
            </ul>
            <div className="flex gap-2">
              <input
                value={newCheck}
                onChange={e => setNewCheck(e.target.value)}
                placeholder="مورد جدید برای چک‌لیست دفاع..."
                className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none"
              />
              <button
                onClick={() => {
                  if (!newCheck.trim()) return;
                  updateDefense({ checklist: [...defense.checklist, { id: uid(), title: newCheck.trim(), done: false }] });
                  setNewCheck("");
                }}
                className="rounded-xl bg-slate-800 px-4 py-2 text-xs font-medium text-white"
              >
                + افزودن
              </button>
            </div>
          </div>

          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 className="mb-3 text-sm font-bold text-slate-800">اعضای هیئت داوران و اساتید</h3>
            {defense.committee.length > 0 && (
              <ul className="mb-4 space-y-2">
                {defense.committee.map(c => (
                  <li key={c.id} className="flex items-center justify-between rounded-xl border border-slate-100 p-2.5">
                    <div>
                      <p className="text-sm font-bold text-slate-800">{c.name}</p>
                      <p className="text-xs text-slate-400">{c.role} {c.contact ? `· ${c.contact}` : ""}</p>
                    </div>
                    <button
                      onClick={() => updateDefense({ committee: defense.committee.filter(x => x.id !== c.id) })}
                      className="text-rose-400 hover:text-rose-600 text-xs"
                    >
                      🗑️
                    </button>
                  </li>
                ))}
              </ul>
            )}
            <div className="grid grid-cols-1 gap-2 sm:grid-cols-3">
              <input
                value={member.name}
                onChange={e => setMember({ ...member, name: e.target.value })}
                placeholder="نام استاد"
                className="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none"
              />
              <input
                value={member.role}
                onChange={e => setMember({ ...member, role: e.target.value })}
                placeholder="سمت (مثلاً داور داخلی / مشاور)"
                className="rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none"
              />
              <div className="flex gap-2">
                <input
                  value={member.contact}
                  onChange={e => setMember({ ...member, contact: e.target.value })}
                  placeholder="ایمیل / تماس"
                  className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none"
                />
                <button
                  onClick={() => {
                    if (!member.name.trim()) return;
                    updateDefense({ committee: [...defense.committee, { id: uid(), ...member }] });
                    setMember({ name: "", role: "", contact: "" });
                  }}
                  className="rounded-xl bg-indigo-600 px-3.5 py-2 text-xs font-medium text-white"
                >
                  افزودن
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // مودال پاسخ به وظیفه + بارگذاری فایل پیوست
    // -------------------------------------------------------------------------
    function ActionResponseModal({ actionId, onClose }) {
      const { store, updateStore, toast } = useApp();
      const action = store.actions.find(a => a.id === actionId);
      const [respText, setRespText] = useState(action?.response || "");
      const [uploading, setUploading] = useState(false);
      const fileRef = useRef(null);

      useEffect(() => {
        setRespText(action?.response || "");
      }, [actionId]);

      if (!action) return null;
      const session = store.sessions.find(s => s.id === action.sessionId);
      const attachments = action.attachments || [];

      const handleUploadInModal = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        setUploading(true);
        try {
          const uploaded = await uploadAttachmentFile(file);
          updateStore(s => ({
            ...s,
            actions: s.actions.map(a => a.id === action.id ? {
              ...a,
              attachments: [...(a.attachments || []), uploaded]
            } : a)
          }));
          toast("فایل پیوست شد");
        } catch (err) {
          toast(err.message || "خطا در آپلود فایل", "err");
        } finally {
          setUploading(false);
        }
      };

      const removeAtt = (attId) => {
        updateStore(s => ({
          ...s,
          actions: s.actions.map(a => a.id === action.id ? {
            ...a,
            attachments: (a.attachments || []).filter(x => x.id !== attId)
          } : a)
        }));
      };

      const saveResponse = () => {
        updateStore(s => ({
          ...s,
          actions: s.actions.map(a => a.id === action.id ? {
            ...a,
            response: respText.trim(),
            done: true,
            respondedAt: new Date().toISOString()
          } : a)
        }));
        toast("پاسخ و فایل‌های وظیفه ذخیره شد");
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" onClick={onClose}>
          <div className="animate-modal w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b pb-3">
              <h3 className="text-base font-bold text-slate-800">ثبت پاسخ و بارگذاری فایل تکلیف</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700">✖</button>
            </div>

            <div className="rounded-xl bg-slate-50 p-3">
              <p className="text-sm font-bold text-slate-800">{action.title}</p>
              <p className="text-xs text-slate-400 mt-1">
                مرتبط با: {session?.title || "—"} · مسئول: {action.owner ?? "من"}
              </p>
            </div>

            <label className="block">
              <span className="mb-1.5 block text-xs font-semibold text-slate-600">پاسخ / توضیحات انجام کار:</span>
              <textarea
                rows={4}
                value={respText}
                onChange={e => setRespText(e.target.value)}
                placeholder="توضیح دهید این وظیفه چگونه انجام شد..."
                className="w-full rounded-xl border border-slate-200 p-3 text-sm outline-none focus:border-indigo-500"
              />
            </label>

            <div>
              <div className="mb-1.5 flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600">فایل‌های پیوست این تکلیف:</span>
                <button
                  type="button"
                  onClick={() => fileRef.current?.click()}
                  disabled={uploading}
                  className="text-xs font-bold text-indigo-600 hover:text-indigo-800"
                >
                  📎 {uploading ? "در حال آپلود..." : "+ افزودن فایل"}
                </button>
                <input ref={fileRef} type="file" className="hidden" onChange={handleUploadInModal} />
              </div>
              <p className="mb-2 text-[11px] text-slate-400">حداکثر حجم مجاز هر فایل: ۲۵ مگابایت (فایل‌های HTML به صورت صفحه وب کامل باز می‌شوند)</p>

              {attachments.length === 0 ? (
                <p className="rounded-xl border border-dashed border-slate-200 p-3 text-center text-xs text-slate-400">
                  فایلی پیوست نشده است.
                </p>
              ) : (
                <div className="flex flex-wrap gap-2 max-h-40 overflow-y-auto p-1">
                  {attachments.map(att => (
                    <AttachmentChip
                      key={att.id}
                      att={att}
                      onRemove={() => removeAtt(att.id)}
                    />
                  ))}
                </div>
              )}
            </div>

            <div className="flex items-center justify-between pt-3 border-t">
              <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                <input
                  type="checkbox"
                  checked={action.done}
                  onChange={() => updateStore(s => ({
                    ...s,
                    actions: s.actions.map(a => a.id === action.id ? { ...a, done: !a.done } : a)
                  }))}
                  className="size-4 accent-indigo-600"
                />
                <span>وظیفه انجام شده است</span>
              </label>
              <div className="flex gap-2">
                <button onClick={onClose} className="rounded-xl border px-4 py-2 text-xs font-medium text-slate-600">انصراف</button>
                <button onClick={saveResponse} className="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-bold text-white hover:bg-indigo-700">
                  ثبت پاسخ
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // پوسته اصلی برنامه
    // -------------------------------------------------------------------------
    const NAV_ITEMS = [
      { key: "overview", label: "نمای کلی", sub: "خلاصه وضعیت پیشرفت پایان‌نامه", icon: "📊" },
      { key: "sessions", label: "جلسات با استاد راهنما", sub: "ثبت خلاصه جلسات، بازخورد استاد و وظایف", icon: "👥" },
      { key: "writing", label: "نگارش فصول", sub: "پیگیری پیشرفت نگارش هر فصل", icon: "✍️" },
      { key: "framework", label: "چارچوب و ساختار", sub: "ساختار کلی و اجزای پایان‌نامه", icon: "🌿" },
      { key: "notes", label: "یادداشت‌ها", sub: "ایده‌ها و نکات مهم", icon: "📝" },
      { key: "timeline", label: "جدول زمانی", sub: "رویدادها و مهلت‌های کلیدی", icon: "📅" },
      { key: "defense", label: "آماده‌سازی دفاع", sub: "چک‌لیست و اطلاعات جلسه دفاع", icon: "🎓" }
    ];

    function MainShell() {
      const { store, updateStore, syncStatus, toasts, confirmDialog, setConfirmDialog, user, onLogout, toast } = useApp();
      const [view, setView] = useState("overview");
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [activeActionId, setActiveActionId] = useState(null);
      const [searchOpen, setSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [highlightSessionId, setHighlightSessionId] = useState(null);
      const fileInputRef = useRef(null);

      const currentNav = NAV_ITEMS.find(n => n.key === view) || NAV_ITEMS[0];

      const handleExport = () => {
        const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `thesis-backup-${todayIso()}.json`;
        a.click();
        toast("فایل پشتیبان دانلود شد");
      };

      const handleImport = (file) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed.sessions && parsed.chapters) {
              updateStore(parsed);
              toast("فایل پشتیبان با موفقیت بازیابی شد");
            }
          } catch {
            toast("فایل پشتیبان نامعتبر است", "err");
          }
        };
        reader.readAsText(file);
      };

      const statusBadge = {
        live: { text: "همگام‌سازی ابری فعال (آنلاین)", cls: "bg-teal-700" },
        saving: { text: "در حال ذخیره در ابر...", cls: "bg-indigo-600" },
        connecting: { text: "در حال اتصال به دیتابیس...", cls: "bg-slate-500" },
        error: { text: "ذخیره محلی", cls: "bg-amber-700" }
      }[syncStatus];

      return (
        <div className="min-h-screen md:flex">
          {sidebarOpen && <div className="fixed inset-0 z-40 bg-slate-900/40 md:hidden" onClick={() => setSidebarOpen(false)} />}
          <aside className={`fixed inset-y-0 right-0 z-50 w-72 shrink-0 border-l border-slate-200 bg-white transition-transform duration-200 md:static md:w-64 md:translate-x-0 flex flex-col justify-between ${sidebarOpen ? "translate-x-0" : "translate-x-full"}`}>
            <div>
              <div className="flex h-16 items-center justify-between border-b border-slate-100 px-5">
                <div className="flex items-center gap-2.5">
                  <div className="flex size-9 items-center justify-center rounded-xl bg-indigo-700 text-white shadow-md">🎓</div>
                  <div>
                    <p className="text-sm font-extrabold text-slate-800">گزارش کار</p>
                    <p className="text-[11px] text-slate-400">پورتال مشترک پایان‌نامه</p>
                  </div>
                </div>
                <button onClick={() => setSidebarOpen(false)} className="text-slate-400 md:hidden">✖</button>
              </div>

              <nav className="flex flex-col gap-1 p-3">
                {NAV_ITEMS.map(item => {
                  const active = view === item.key;
                  return (
                    <button
                      key={item.key}
                      onClick={() => { setView(item.key); setSidebarOpen(false); }}
                      className={`flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium transition ${
                        active ? "bg-indigo-50 text-indigo-700 font-bold" : "text-slate-600 hover:bg-slate-50"
                      }`}
                    >
                      <span>{item.icon}</span>
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="border-t border-slate-100 p-4 space-y-2">
              <div className="flex items-center justify-between text-xs text-slate-500">
                <span className="truncate font-mono" dir="ltr">{user.email}</span>
                <button onClick={onLogout} className="text-rose-600 font-bold hover:underline shrink-0">خروج</button>
              </div>
              <p className="text-[11px] leading-5 text-slate-400">
                تمامی تغییرات و فایل‌های پیوست در دیتابیس ابری ذخیره شده و بین استاد و دانشجو مشترک است.
              </p>
            </div>
          </aside>

          <div className="flex-1 min-w-0">
            <header className="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/85 px-4 backdrop-blur md:px-6">
              <button onClick={() => setSidebarOpen(true)} className="rounded-lg p-2 text-slate-600 hover:bg-slate-100 md:hidden">☰</button>
              <div className="min-w-0 flex-1">
                <h1 className="truncate text-base font-bold text-slate-800 md:text-lg">{currentNav.label}</h1>
                <p className="hidden truncate text-xs text-slate-400 sm:block">{currentNav.sub}</p>
              </div>

              <button
                onClick={() => setSearchOpen(true)}
                className="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-50"
              >
                <span>🔍 جستجو</span>
              </button>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={handleExport}
                  className="rounded-xl border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50"
                >
                  ⬇️ پشتیبان
                </button>
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="rounded-xl border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50"
                >
                  ⬆️ بازیابی
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="application/json"
                  className="hidden"
                  onChange={e => e.target.files?.[0] && handleImport(e.target.files[0])}
                />
              </div>
            </header>

            <main className="px-4 py-6 pb-24 md:px-6 max-w-6xl mx-auto">
              {view === "overview" && (
                <OverviewView
                  onNavigate={setView}
                  onOpenResponse={setActiveActionId}
                />
              )}
              {view === "sessions" && (
                <SessionsView
                  onOpenResponse={setActiveActionId}
                  highlightId={highlightSessionId}
                  clearHighlight={() => setHighlightSessionId(null)}
                />
              )}
              {view === "writing" && <WritingView />}
              {view === "framework" && <FrameworkView />}
              {view === "notes" && <NotesView />}
              {view === "timeline" && <TimelineView />}
              {view === "defense" && <DefenseView />}
            </main>
          </div>

          <div className={`fixed bottom-3 left-3 z-40 rounded-full px-3.5 py-1.5 text-[11px] font-medium text-white shadow-lg ${statusBadge.cls}`}>
            {statusBadge.text}
          </div>

          {activeActionId && (
            <ActionResponseModal actionId={activeActionId} onClose={() => setActiveActionId(null)} />
          )}

          {searchOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center bg-slate-900/50 p-4 pt-20" onClick={() => setSearchOpen(false)}>
              <div className="animate-modal w-full max-w-xl rounded-2xl bg-white p-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center gap-2 border-b pb-3">
                  <span>🔍</span>
                  <input
                    autoFocus
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="جستجو در جلسات، وظایف، یادداشت‌ها..."
                    className="flex-1 text-sm outline-none"
                  />
                  <button onClick={() => setSearchOpen(false)} className="text-slate-400">✖</button>
                </div>
                <div className="max-h-80 overflow-y-auto py-2 space-y-1">
                  {searchQuery.trim() === "" ? (
                    <p className="py-6 text-center text-xs text-slate-400">عبارت مورد نظر را تایپ کنید...</p>
                  ) : (
                    <>
                      {store.sessions.filter(s => (s.title + s.summary).includes(searchQuery)).map(s => (
                        <button
                          key={s.id}
                          onClick={() => { setView("sessions"); setHighlightSessionId(s.id); setSearchOpen(false); }}
                          className="flex w-full items-center justify-between rounded-xl px-3 py-2 text-right hover:bg-slate-50 text-sm"
                        >
                          <span>👥 {s.title}</span>
                          <span className="text-xs text-slate-400">{formatJalali(s.date)}</span>
                        </button>
                      ))}
                      {store.actions.filter(a => a.title.includes(searchQuery)).map(a => (
                        <button
                          key={a.id}
                          onClick={() => { setActiveActionId(a.id); setSearchOpen(false); }}
                          className="flex w-full items-center justify-between rounded-xl px-3 py-2 text-right hover:bg-slate-50 text-sm"
                        >
                          <span>📋 {a.title}</span>
                          <span className="text-xs text-slate-400">{a.done ? "انجام‌شده" : "باز"}</span>
                        </button>
                      ))}
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

          {confirmDialog && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" onClick={() => setConfirmDialog(null)}>
              <div className="animate-modal w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                <h3 className="text-base font-bold text-slate-800 mb-2">⚠️ تایید عملیات</h3>
                <p className="text-sm text-slate-600 mb-6">{confirmDialog.message}</p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setConfirmDialog(null)} className="rounded-lg border px-4 py-2 text-xs font-medium">انصراف</button>
                  <button
                    onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }}
                    className="rounded-lg bg-rose-600 px-4 py-2 text-xs font-bold text-white hover:bg-rose-700"
                  >
                    تایید و حذف
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
            {toasts.map(t => (
              <div key={t.id} className={`rounded-xl px-4 py-2.5 text-xs font-bold text-white shadow-lg ${t.type === "err" ? "bg-rose-600" : "bg-emerald-600"}`}>
                {t.message}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // کامپوننت ریشه و صفحه لاگین
    // -------------------------------------------------------------------------
    function RootApp() {
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(true);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      useEffect(() => {
        sbClient.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user || null);
          setChecking(false);
        });
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErr("");
        const { data, error } = await sbClient.auth.signInWithPassword({ email: email.trim(), password });
        setLoading(false);
        if (error) {
          setErr("ایمیل یا رمز عبور اشتباه است.");
        } else {
          setUser(data.user);
        }
      };

      const handleLogout = async () => {
        await sbClient.auth.signOut();
        setUser(null);
      };

      if (checking) {
        return <div className="flex min-h-screen items-center justify-center text-sm text-slate-500">در حال بارگذاری...</div>;
      }

      if (!user) {
        return (
          <div className="flex min-h-screen items-center justify-center p-4 bg-gradient-to-br from-slate-100 to-indigo-50">
            <form onSubmit={handleLogin} className="w-full max-w-md space-y-4 rounded-2xl bg-white p-8 shadow-xl border border-slate-100">
              <div className="text-center">
                <div className="mx-auto mb-3 flex size-12 items-center justify-center rounded-2xl bg-indigo-700 text-white text-2xl shadow-md">🎓</div>
                <h1 className="text-xl font-extrabold text-slate-800">پورتال جامع پایان‌نامه</h1>
                <p className="text-xs text-slate-400 mt-1">ورود مشترک استاد راهنما و دانشجو</p>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">ایمیل کاربری</label>
                <input
                  type="email"
                  required
                  dir="ltr"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  placeholder="example@gmail.com"
                  className="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-600"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">رمز عبور</label>
                <input
                  type="password"
                  required
                  dir="ltr"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-600"
                />
              </div>
              {err && <p className="text-xs text-rose-600 text-center font-medium">{err}</p>}
              <button
                type="submit"
                disabled={loading}
                className="w-full rounded-xl bg-indigo-700 hover:bg-indigo-800 py-2.5 text-sm font-bold text-white transition shadow-md"
              >
                {loading ? "در حال ورود..." : "ورود به سامانه"}
              </button>
            </form>
          </div>
        );
      }

      return (
        <AppProvider user={user} onLogout={handleLogout}>
          <MainShell />
        </AppProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<RootApp />);
  </script>
</body>
</html>
