    // -------------------------------------------------------------------------
    // توابع کمکی تاریخ شمسی، اعداد فارسی و مدیریت باز کردن صحیح فایل‌ها
    // -------------------------------------------------------------------------
    const JALALI_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
    const toFaDigits = (n) => String(n ?? "").replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[+d]);
    const pad2 = (n) => String(n).padStart(2, "0");

    function formatFileSize(bytes) {
      if (!bytes) return "";
      if (bytes < 1024) return `${toFaDigits(bytes)} بایت`;
      if (bytes < 1024 * 1024) return `${toFaDigits((bytes / 1024).toFixed(1))} کیلوبایت`;
      return `${toFaDigits((bytes / (1024 * 1024)).toFixed(1))} مگابایت`;
    }

    // تشخیص MIME Type صحیح بر اساس پسوند فایل
    function getMimeType(filename, fallbackType) {
      const ext = (filename || "").split(".").pop().toLowerCase();
      if (ext === "html" || ext === "htm") return "text/html;charset=utf-8";
      if (ext === "pdf") return "application/pdf";
      if (ext === "txt" || ext === "md" || ext === "csv") return "text/plain;charset=utf-8";
      if (ext === "json") return "application/json;charset=utf-8";
      if (ext === "png") return "image/png";
      if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
      if (ext === "svg") return "image/svg+xml";
      return fallbackType || "application/octet-stream";
    }

    // باز کردن صحیح فایل‌های HTML و سایر مستندات با پشتیبانی کامل از UTF-8
    async function openAttachmentProperly(att, forceDownload = false) {
      const rawUrl = att.url || att.dataUrl;
      if (!rawUrl) return;

      const isHtml = /\.(html|htm)$/i.test(att.name || "") || (att.type && att.type.includes("html"));
      const mime = getMimeType(att.name, att.type);

      try {
        // اگر فایل DataURL (Base64) باشد
        if (rawUrl.startsWith("data:")) {
          const res = await fetch(rawUrl);
          const buf = await res.arrayBuffer();
          const blob = new Blob([buf], { type: mime });
          const blobUrl = URL.createObjectURL(blob);
          if (forceDownload) {
            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = att.name || "file";
            a.click();
          } else {
            window.open(blobUrl, "_blank");
          }
          return;
        }

        // اگر فایل HTML یا متنی روی Supabase Storage باشد یا کاربر دانلود بخواهد
        if (isHtml || forceDownload) {
          const res = await fetch(rawUrl);
          const buf = await res.arrayBuffer();
          const blob = new Blob([buf], { type: mime });
          const blobUrl = URL.createObjectURL(blob);

          if (forceDownload) {
            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = att.name || "file";
            a.click();
          } else {
            window.open(blobUrl, "_blank");
          }
          return;
        }

        // سایر فایل‌ها (PDF، تصویر و...) در تب جدید باز شوند
        window.open(rawUrl, "_blank");
      } catch (e) {
        window.open(rawUrl, "_blank");
      }
    }

    function gregorianToJalali(gy, gm, gd) {
      const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
      let jy = gy <= 1600 ? 0 : 979;
      gy -= gy <= 1600 ? 621 : 1600;
      const gy2 = gm > 2 ? gy + 1 : gy;
      let days = 365 * gy + Math.trunc((gy2 + 3) / 4) - Math.trunc((gy2 + 99) / 100) + Math.trunc((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
      jy += 33 * Math.trunc(days / 12053);
      days %= 12053;
      jy += 4 * Math.trunc(days / 1461);
      days %= 1461;
      jy += Math.trunc((days - 1) / 365);
      if (days > 365) days = (days - 1) % 365;
      const jm = days < 186 ? 1 + Math.trunc(days / 31) : 7 + Math.trunc((days - 186) / 30);
      const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
      return [jy, jm, jd];
    }

    function jalaliToGregorian(jy, jm, jd) {
      let gy = jy <= 979 ? 621 : 1600;
      jy -= jy <= 979 ? 0 : 979;
      let days = 365 * jy + Math.trunc(jy / 33) * 8 + Math.trunc((jy % 33 + 3) / 4) + 78 + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
      gy += 400 * Math.trunc(days / 146097);
      days %= 146097;
      if (days > 36524) {
        gy += 100 * Math.trunc(--days / 36524);
        days %= 36524;
        if (days >= 365) days++;
      }
      gy += 4 * Math.trunc(days / 1461);
      days %= 1461;
      gy += Math.trunc((days - 1) / 365);
      if (days > 365) days = (days - 1) % 365;
      let gd = days + 1;
      const sal_a = [0,31,(gy%4===0 && gy%100!==0) || gy%400===0 ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
      let gm = 0;
      for (gm = 0; gm < 13 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
      return `${gy}-${pad2(gm)}-${pad2(gd)}`;
    }

    function formatJalali(isoStr) {
      if (!isoStr) return "—";
      try {
        const parts = isoStr.slice(0, 10).split("-").map(Number);
        if (parts.length !== 3 || isNaN(parts[0])) return isoStr;
        const [jy, jm, jd] = gregorianToJalali(parts[0], parts[1], parts[2]);
        return `${toFaDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${toFaDigits(jy)}`;
      } catch {
        return isoStr;
      }
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    // آپلود فایل با تعیین دقیق Content-Type
    async function uploadAttachmentFile(file) {
      if (file.size > MAX_FILE_SIZE) {
        throw new Error("حجم فایل بیشتر از ۲۵ مگابایت است.");
      }

      const ext = file.name.includes(".") ? file.name.split(".").pop() : "bin";
      const safePath = `uploads/${Date.now()}_${uid()}.${ext}`;
      const mimeType = getMimeType(file.name, file.type);

      const { data, error } = await sbClient.storage
        .from("thesis-files")
        .upload(safePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: mimeType
        });

      if (!error && data) {
        const { data: pubData } = sbClient.storage.from("thesis-files").getPublicUrl(safePath);
        return {
          id: uid(),
          name: file.name,
          size: file.size,
          type: mimeType,
          url: pubData.publicUrl,
          storagePath: safePath,
          addedAt: new Date().toISOString()
        };
      }

      if (file.size > 5 * 1024 * 1024) {
        throw new Error("برای فایل‌های بالای ۵ مگابایت، لطفاً کد SQL ساخت باکت thesis-files را در Supabase اجرا کنید.");
      }

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          resolve({
            id: uid(),
            name: file.name,
            size: file.size,
            type: mimeType,
            url: reader.result,
            addedAt: new Date().toISOString()
          });
        };
        reader.onerror = () => reject(new Error("خطا در خواندن فایل"));
        reader.readAsDataURL(file);
      });
    }

    // -------------------------------------------------------------------------
    // انتخابگر تاریخ شمسی
    // -------------------------------------------------------------------------
    function JalaliDatePicker({ value, onChange, allowEmpty = false, dark = false }) {
      const todayParts = gregorianToJalali(...todayIso().split("-").map(Number));
      const currentParts = value ? gregorianToJalali(...value.slice(0, 10).split("-").map(Number)) : [0, 0, 0];
      const minYear = Math.min(todayParts[0] - 2, currentParts[0] || todayParts[0]);
      const maxYear = Math.max(todayParts[0] + 5, currentParts[0] || todayParts[0]);

      const selectClass = dark
        ? "min-w-0 w-full rounded-xl border border-white/30 bg-white/10 px-2 py-2 text-xs md:text-sm text-white outline-none [&>option]:bg-white [&>option]:text-slate-800"
        : "min-w-0 w-full rounded-xl border border-slate-200 bg-white px-2 py-2 text-xs md:text-sm text-slate-800 outline-none focus:border-indigo-500";

      const handlePartChange = (index, val) => {
        const next = [...currentParts];
        next[index] = val;
        if (allowEmpty && !val) {
          onChange("");
          return;
        }
        const y = next[0] || todayParts[0];
        const m = next[1] || todayParts[1];
        const maxD = m <= 6 ? 31 : m <= 11 ? 30 : 29;
        const d = Math.min(next[2] || todayParts[2], maxD);
        onChange(jalaliToGregorian(y, m, d));
      };

      return (
        <div className="grid w-full gap-1.5" style={{ gridTemplateColumns: "4rem minmax(5.5rem,1fr) 5rem" }}>
          <select value={currentParts[2]} onChange={e => handlePartChange(2, +e.target.value)} className={selectClass}>
            {allowEmpty && <option value={0}>روز</option>}
            {Array.from({ length: 31 }, (_, i) => (
              <option key={i+1} value={i+1}>{toFaDigits(i+1)}</option>
            ))}
          </select>
          <select value={currentParts[1]} onChange={e => handlePartChange(1, +e.target.value)} className={selectClass}>
            {allowEmpty && <option value={0}>ماه</option>}
            {JALALI_MONTHS.map((m, i) => (
              <option key={m} value={i+1}>{m}</option>
            ))}
          </select>
          <select value={currentParts[0]} onChange={e => handlePartChange(0, +e.target.value)} className={selectClass}>
            {allowEmpty && <option value={0}>سال</option>}
            {Array.from({ length: maxYear - minYear + 1 }, (_, i) => (
              <option key={minYear+i} value={minYear+i}>{toFaDigits(minYear+i)}</option>
            ))}
          </select>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // مدیریت وضعیت برنامه + همگام‌سازی زنده با Supabase
    // -------------------------------------------------------------------------
    const AppContext = createContext(null);

    function AppProvider({ children, user, onLogout }) {
      const [store, setStore] = useState(() => {
        try {
          const cached = localStorage.getItem("thesis_full_cache_v3");
          return cached ? JSON.parse(cached) : getInitialData();
        } catch {
          return getInitialData();
        }
      });
      const [syncStatus, setSyncStatus] = useState("connecting");
      const [toasts, setToasts] = useState([]);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const isInitialLoad = useRef(true);
      const saveTimeout = useRef(null);

      const toast = (message, type = "ok") => {
        const id = uid();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      const askConfirm = (message, onConfirm) => {
        setConfirmDialog({ message, onConfirm });
      };

      useEffect(() => {
        let mounted = true;
        async function loadRemote() {
          setSyncStatus("connecting");
          const { data, error } = await sbClient
            .from("thesis_store")
            .select("data")
            .eq("id", "main")
            .maybeSingle();

          if (!mounted) return;

          if (error) {
            setSyncStatus("error");
            return;
          }

          if (data && data.data) {
            setStore(data.data);
            localStorage.setItem("thesis_full_cache_v3", JSON.stringify(data.data));
            setSyncStatus("live");
          } else {
            const initial = getInitialData();
            const { error: insErr } = await sbClient
              .from("thesis_store")
              .upsert({ id: "main", data: initial, updated_at: new Date().toISOString() });
            setSyncStatus(insErr ? "error" : "live");
          }
          isInitialLoad.current = false;
        }

        loadRemote();

        const channel = sbClient
          .channel("realtime_thesis_store")
          .on("postgres_changes", { event: "*", schema: "public", table: "thesis_store", filter: "id=eq.main" }, payload => {
            if (payload.new && payload.new.data) {
              setStore(payload.new.data);
              localStorage.setItem("thesis_full_cache_v3", JSON.stringify(payload.new.data));
              setSyncStatus("live");
            }
          })
          .subscribe();

        return () => {
          mounted = false;
          sbClient.removeChannel(channel);
        };
      }, []);

      const updateStore = (updater) => {
        setStore(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          localStorage.setItem("thesis_full_cache_v3", JSON.stringify(next));

          if (!isInitialLoad.current) {
            setSyncStatus("saving");
            if (saveTimeout.current) clearTimeout(saveTimeout.current);
            saveTimeout.current = setTimeout(async () => {
              const { error } = await sbClient
                .from("thesis_store")
                .upsert({ id: "main", data: next, updated_at: new Date().toISOString() });
              setSyncStatus(error ? "error" : "live");
            }, 500);
          }
          return next;
        });
      };

      const value = {
        store,
        updateStore,
        syncStatus,
        toast,
        toasts,
        askConfirm,
        confirmDialog,
        setConfirmDialog,
        user,
        onLogout
      };

      return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    }

    const useApp = () => useContext(AppContext);

    // -------------------------------------------------------------------------
    // ۱. نمای کلی (Overview)
    // -------------------------------------------------------------------------
    function OverviewView({ onNavigate, onOpenResponse }) {
      const { store, updateStore } = useApp();
      const doneActions = store.actions.filter(a => a.done).length;
      const actionPct = store.actions.length ? Math.round((doneActions / store.actions.length) * 100) : 0;
      const openActions = store.actions.filter(a => !a.done);
      const nextMilestone = [...store.milestones].filter(m => !m.done).sort((a, b) => a.date.localeCompare(b.date))[0];
      const chapterPct = store.chapters.length ? Math.round(store.chapters.reduce((s, c) => s + Number(c.progress || 0), 0) / store.chapters.length) : 0;
      const overallPct = store.actions.length && store.chapters.length ? Math.round((actionPct + chapterPct) / 2) : (store.actions.length ? actionPct : chapterPct);

      const myOpenActions = openActions.filter(a => (a.owner ?? "من") === "من");
      const profOpenActions = openActions.filter(a => a.owner === "استاد");

      const statCards = [
        { key: "sessions", label: "وظایف باز", value: toFaDigits(openActions.length), color: "from-slate-600 to-slate-700", icon: "📋" },
        { key: "sessions", label: "جلسات ثبت‌شده", value: toFaDigits(store.sessions.length), color: "from-indigo-700 to-indigo-800", icon: "👥" },
        { key: "timeline", label: "رویدادهای پیش‌رو", value: toFaDigits(store.milestones.filter(m => !m.done).length), color: "from-slate-500 to-slate-600", icon: "📅" },
        { key: "sessions", label: "وظایف انجام‌شده", value: toFaDigits(doneActions), color: "from-teal-700 to-teal-800", icon: "✅" }
      ];

      return (
        <div className="space-y-6">
          <div className="rounded-2xl bg-indigo-800 p-6 text-white shadow-sm md:p-8">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/15 pb-4 mb-4">
              <div>
                <input
                  value={store.meta?.title || "گزارش کار پایان‌نامه"}
                  onChange={e => updateStore(s => ({ ...s, meta: { ...s.meta, title: e.target.value } }))}
                  className="bg-transparent text-lg md:text-xl font-extrabold text-white outline-none border-b border-transparent focus:border-white/40"
                />
                <div className="flex flex-wrap gap-4 mt-1 text-xs text-indigo-200">
                  <label className="flex items-center gap-1">
                    <span>پژوهشگر:</span>
                    <input
                      value={store.meta?.student || ""}
                      onChange={e => updateStore(s => ({ ...s, meta: { ...s.meta, student: e.target.value } }))}
                      placeholder="نام دانشجو..."
                      className="bg-white/10 rounded px-2 py-0.5 text-white outline-none"
                    />
                  </label>
                  <label className="flex items-center gap-1">
                    <span>استاد راهنما:</span>
                    <input
                      value={store.meta?.advisor || ""}
                      onChange={e => updateStore(s => ({ ...s, meta: { ...s.meta, advisor: e.target.value } }))}
                      placeholder="نام استاد..."
                      className="bg-white/10 rounded px-2 py-0.5 text-white outline-none"
                    />
                  </label>
                </div>
              </div>
              <span className="text-xs bg-white/15 px-3 py-1 rounded-full text-indigo-100">پیشرفت کل پایان‌نامه</span>
            </div>

            <div className="flex flex-wrap items-end justify-between gap-4">
              <div>
                <p className="text-4xl font-extrabold">{toFaDigits(overallPct)}٪</p>
                <p className="mt-1 text-sm text-indigo-100">
                  {toFaDigits(doneActions)} از {toFaDigits(store.actions.length)} اقدام انجام شده · میانگین پیشرفت فصول {toFaDigits(chapterPct)}٪
                </p>
              </div>
              {nextMilestone && (
                <div className="rounded-xl bg-white/10 px-4 py-3">
                  <p className="text-xs text-indigo-200">نزدیک‌ترین رویداد</p>
                  <p className="text-sm font-bold mt-0.5">{nextMilestone.title}</p>
                  <p className="text-xs text-indigo-200 mt-0.5">{formatJalali(nextMilestone.date)}</p>
                </div>
              )}
            </div>
            <div className="mt-5 h-2.5 w-full overflow-hidden rounded-full bg-white/20">
              <div className="h-full rounded-full bg-white transition-all duration-300" style={{ width: `${overallPct}%` }} />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
            {statCards.map((c, i) => (
              <button
                key={i}
                onClick={() => onNavigate(c.key)}
                className="group rounded-2xl border border-slate-200 bg-white p-4 text-right shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
              >
                <div className={`mb-3 flex size-10 items-center justify-center rounded-xl bg-gradient-to-br ${c.color} text-white text-lg`}>
                  {c.icon}
                </div>
                <p className="text-2xl font-extrabold text-slate-800">{c.value}</p>
                <p className="text-xs text-slate-400 mt-0.5">{c.label}</p>
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 gap-6 lg:grid-cols-5">
            <div className="space-y-6 lg:col-span-2">
              {[["وظایف من (دانشجو)", myOpenActions], ["موارد مرتبط با استاد راهنما", profOpenActions]].map(([title, list]) => (
                <div key={title} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                  <h3 className="mb-3 flex items-center justify-between text-sm font-bold text-slate-800">
                    <span>{title}</span>
                    <span className="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-600">
                      {toFaDigits(list.length)}
                    </span>
                  </h3>
                  {list.length === 0 ? (
                    <p className="text-xs text-slate-400">مورد بازی وجود ندارد.</p>
                  ) : (
                    <ul className="space-y-2">
                      {list.map(act => (
                        <li key={act.id}>
                          <button
                            onClick={() => onOpenResponse(act.id)}
                            className="w-full rounded-xl border border-slate-100 p-2.5 text-right hover:bg-slate-50 transition"
                          >
                            <p className="text-sm leading-7 text-slate-700">{act.title}</p>
                            <div className="flex items-center gap-2 mt-1">
                              {act.dueDate && <span className="text-[11px] text-slate-400">مهلت: {formatJalali(act.dueDate)}</span>}
                              {(act.attachments?.length > 0) && (
                                <span className="text-[11px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">
                                  📎 {toFaDigits(act.attachments.length)} فایل
                                </span>
                              )}
                            </div>
                          </button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              ))}
            </div>

            <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-3">
              <div className="mb-4 flex items-center justify-between">
                <h3 className="text-sm font-bold text-slate-800">✍️ پیشرفت نگارش فصول</h3>
                <button onClick={() => onNavigate("writing")} className="text-xs font-medium text-indigo-600 hover:underline">
                  مشاهده و ویرایش فصول
                </button>
              </div>
              <p className="mb-4 text-xs text-slate-400">میانگین پیشرفت کلی: {toFaDigits(chapterPct)}٪</p>
              <ul className="space-y-3.5">
                {store.chapters.map(ch => (
                  <li key={ch.id}>
                    <div className="mb-1 flex items-center justify-between text-xs">
                      <span className="font-medium text-slate-700">{ch.title}</span>
                      <span className="text-slate-400">{toFaDigits(ch.progress)}٪ ({ch.status})</span>
                    </div>
                    <div className="h-2 w-full overflow-hidden rounded-full bg-slate-100">
                      <div className="h-full rounded-full bg-indigo-600 transition-all" style={{ width: `${ch.progress}%` }} />
                    </div>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // ۲. بخش جلسات با استاد راهنما + بارگذاری و اجرای صحیح فایل‌ها
    // -------------------------------------------------------------------------
    function SessionsView({ onOpenResponse, highlightId, clearHighlight }) {
      const { store, updateStore, toast } = useApp();
      const sortedAsc = useMemo(() => [...store.sessions].sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt).localeCompare(String(b.createdAt))), [store.sessions]);
      const [expandedId, setExpandedId] = useState(() => sortedAsc[sortedAsc.length - 1]?.id || null);

      useEffect(() => {
        if (highlightId) {
          setExpandedId(highlightId);
          setTimeout(() => {
            document.getElementById(`session-${highlightId}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 100);
          const t = setTimeout(clearHighlight, 2500);
          return () => clearTimeout(t);
        }
      }, [highlightId]);

      const addNewSession = () => {
        const last = sortedAsc[sortedAsc.length - 1];
        const newId = uid();
        const newSession = {
          id: newId,
          title: `جلسه ${toFaDigits(sortedAsc.length + 1)}`,
          date: last?.nextDate || todayIso(),
          nextDate: "",
          type: "حضوری",
          summary: "",
          decisions: "",
          feedback: "",
          fileLink: "",
          attachments: [],
          questions: [],
          createdAt: new Date().toISOString()
        };
        updateStore(s => ({ ...s, sessions: [newSession, ...s.sessions] }));
        setExpandedId(newId);
        toast("جلسه جدید ایجاد شد");
      };

      return (
        <div className="space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <p className="text-sm text-slate-500">
              هر جلسه یک گزارش کامل است: خلاصه، پیگیری جلسه قبل، سوالات، تصمیم‌ها، بازخورد استاد و بارگذاری فایل برای تکالیف.
            </p>
            <button
              onClick={addNewSession}
              className="flex shrink-0 items-center gap-1.5 rounded-xl bg-gradient-to-l from-indigo-700 to-indigo-800 px-4 py-2.5 text-sm font-medium text-white shadow hover:opacity-95"
            >
              <span>+ جلسه جدید</span>
            </button>
          </div>

          {sortedAsc.length === 0 ? (
            <div className="rounded-2xl border border-dashed border-slate-200 p-10 text-center text-sm text-slate-400">
              هنوز جلسه‌ای ثبت نشده است.
            </div>
          ) : (
            <div className="space-y-4">
              {[...sortedAsc].reverse().map(session => {
                const idx = sortedAsc.findIndex(x => x.id === session.id);
                const prevSession = idx > 0 ? sortedAsc[idx - 1] : null;
                return (
                  <SessionCard
                    key={session.id}
                    session={session}
                    number={idx + 1}
                    prev={prevSession}
                    expanded={expandedId === session.id}
                    onToggle={() => setExpandedId(prev => prev === session.id ? null : session.id)}
                    onOpenResponse={onOpenResponse}
                  />
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function SectionBanner({ title, count, tone }) {
      return (
        <div className={`mb-2.5 mt-6 rounded-xl bg-gradient-to-l px-4 py-2 text-sm font-bold text-white shadow-sm flex items-center justify-between ${tone}`}>
          <span>{title}</span>
          {count !== undefined && (
            <span className="rounded-full bg-white/25 px-2.5 py-0.5 text-xs">{toFaDigits(count)}</span>
          )}
        </div>
      );
    }

    function ActionRow({ action, onOpenResponse, canDelete }) {
      const { updateStore, askConfirm, toast } = useApp();
      const fileInputRef = useRef(null);
      const [uploading, setUploading] = useState(false);

      const attachments = action.attachments || [];

      const toggleDone = () => {
        updateStore(s => ({
          ...s,
          actions: s.actions.map(a => a.id === action.id ? { ...a, done: !a.done } : a)
        }));
      };

      const toggleOwner = () => {
        updateStore(s => ({
          ...s,
          actions: s.actions.map(a => a.id === action.id ? { ...a, owner: (a.owner ?? "من") === "من" ? "استاد" : "من" } : a)
        }));
      };

      const removeAct = () => {
        askConfirm("این اقدام حذف شود؟", () => {
          updateStore(s => ({ ...s, actions: s.actions.filter(a => a.id !== action.id) }));
        });
      };

      const handleDirectFileUpload = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        setUploading(true);
        try {
          const uploaded = await uploadAttachmentFile(file);
          updateStore(s => ({
            ...s,
            actions: s.actions.map(a => a.id === action.id ? {
              ...a,
              attachments: [...(a.attachments || []), uploaded]
            } : a)
          }));
          toast("فایل با موفقیت به این تکلیف پیوست شد");
        } catch (err) {
          toast(err.message || "خطا در آپلود فایل", "err");
        } finally {
          setUploading(false);
        }
      };

      const removeAttachment = (attId) => {
        updateStore(s => ({
          ...s,
          actions: s.actions.map(a => a.id === action.id ? {
            ...a,
            attachments: (a.attachments || []).filter(x => x.id !== attId)
          } : a)
        }));
        toast("فایل پیوست حذف شد", "info");
      };

      return (
        <li className="rounded-xl border border-slate-200/80 bg-slate-50/70 p-3 space-y-2">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <label className="flex min-w-0 flex-1 items-start gap-2.5 cursor-pointer">
              <input type="checkbox" checked={action.done} onChange={toggleDone} className="mt-1.5 size-4 shrink-0 accent-indigo-600" />
              <div className="min-w-0 flex-1">
                <span className={`text-sm leading-7 block ${action.done ? "text-slate-400 line-through" : "text-slate-800 font-medium"}`}>
                  {action.title}
                </span>
              </div>
            </label>

            <div className="flex flex-wrap shrink-0 items-center gap-1.5">
              <button
                onClick={toggleOwner}
                title="کلیک برای تغییر مسئول (من / استاد)"
                className={`rounded-full px-2.5 py-0.5 text-[11px] font-bold ${
                  action.owner === "استاد" ? "bg-amber-100 text-amber-800" : "bg-slate-200 text-slate-700"
                }`}
              >
                مسئول: {action.owner ?? "من"}
              </button>

              {action.dueDate && <span className="text-[11px] text-slate-400">{formatJalali(action.dueDate)}</span>}

              <button
                onClick={() => fileInputRef.current?.click()}
                disabled={uploading}
                className="flex items-center gap-1 rounded-lg border border-indigo-200 bg-white px-2.5 py-1 text-xs font-medium text-indigo-700 hover:bg-indigo-50 transition"
                title="پیوست فایل (HTML، PDF، Word، کد، تصویر...)"
              >
                <span>📎 {uploading ? "در حال آپلود..." : "بارگذاری فایل"}</span>
              </button>
              <input
                ref={fileInputRef}
                type="file"
                className="hidden"
                onChange={handleDirectFileUpload}
              />

              <button
                onClick={() => onOpenResponse(action.id)}
                className="rounded-lg bg-indigo-600 px-2.5 py-1 text-xs font-medium text-white hover:bg-indigo-700 transition"
              >
                پاسخ / توضیحات
              </button>

              {canDelete && (
                <button onClick={removeAct} className="text-rose-400 hover:text-rose-600 px-1 text-sm" title="حذف">
                  🗑️
                </button>
              )}
            </div>
          </div>

          {action.response && (
            <div className="text-xs text-emerald-800 bg-emerald-50/90 px-3 py-2 rounded-lg border border-emerald-200/60">
              <strong className="block mb-0.5">پاسخ / نتیجه انجام کار:</strong>
              <span className="whitespace-pre-line">{action.response}</span>
            </div>
          )}

          {attachments.length > 0 && (
            <div className="pt-1 flex flex-wrap gap-2">
              {attachments.map(att => (
                <AttachmentChip
                  key={att.id}
                  att={att}
                  onRemove={() => removeAttachment(att.id)}
                />
              ))}
            </div>
          )}
        </li>
      );
    }

    function SessionCard({ session, number, prev, expanded, onToggle, onOpenResponse }) {
      const { store, updateStore, toast, askConfirm } = useApp();
      const [newActTitle, setNewActTitle] = useState("");
      const [newActOwner, setNewActOwner] = useState("من");
      const [newActDue, setNewActDue] = useState("");
      const [newActFiles, setNewActFiles] = useState([]);
      const [uploadingNewAct, setUploadingNewAct] = useState(false);
      const [uploadingSessionFile, setUploadingSessionFile] = useState(false);
      const [newQuestion, setNewQuestion] = useState("");

      const newActFileRef = useRef(null);
      const sessionFileRef = useRef(null);

      const sessionActions = store.actions.filter(a => a.sessionId === session.id);
      const prevActions = prev ? store.actions.filter(a => a.sessionId === prev.id) : [];
      const prevDone = prevActions.filter(a => a.done);
      const prevUndone = prevActions.filter(a => !a.done);
      const questions = session.questions ?? [];
      const sessionAttachments = session.attachments ?? [];

      const updateField = (patch) => {
        updateStore(s => ({
          ...s,
          sessions: s.sessions.map(item => item.id === session.id ? { ...item, ...patch } : item)
        }));
      };

      const handleSelectNewActFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        setUploadingNewAct(true);
        try {
          const uploaded = await uploadAttachmentFile(file);
          setNewActFiles(prev => [...prev, uploaded]);
          toast("فایل آماده پیوست به اقدام جدید شد");
        } catch (err) {
          toast(err.message || "خطا در بارگذاری فایل", "err");
        } finally {
          setUploadingNewAct(false);
        }
      };

      const handleAddAction = () => {
        if (!newActTitle.trim()) {
          toast("لطفاً عنوان اقدام یا تکلیف را وارد کنید", "err");
          return;
        }
        const act = {
          id: uid(),
          sessionId: session.id,
          title: newActTitle.trim(),
          done: false,
          owner: newActOwner,
          dueDate: newActDue || "",
          response: "",
          attachments: newActFiles
        };
        updateStore(s => ({ ...s, actions: [...s.actions, act] }));
        setNewActTitle("");
        setNewActDue("");
        setNewActFiles([]);
        toast("اقدام جدید ثبت شد");
      };

      const handleSessionFileUpload = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        setUploadingSessionFile(true);
        try {
          const uploaded = await uploadAttachmentFile(file);
          updateField({ attachments: [...sessionAttachments, uploaded] });
          toast("فایل پیوست جلسه ذخیره شد");
        } catch (err) {
          toast(err.message || "خطا در آپلود فایل", "err");
        } finally {
          setUploadingSessionFile(false);
        }
      };

      const handleAddQuestion = () => {
        if (!newQuestion.trim()) return;
        updateField({
          questions: [...questions, { id: uid(), text: newQuestion.trim(), answer: "", answered: false }]
        });
        setNewQuestion("");
      };

      const updateQuestion = (qid, patch) => {
        updateField({
          questions: questions.map(q => q.id === qid ? { ...q, ...patch } : q)
        });
      };

      const copyReportText = () => {
        const lines = [
          `📌 گزارش ${session.title} — ${formatJalali(session.date)} (${session.type})`,
          "",
          "🔹 خلاصه مباحث جلسه:",
          session.summary || "—",
          ""
        ];
        if (session.decisions) lines.push("⚖️ تصمیم‌ها و توافقات:", session.decisions, "");
        if (session.feedback) lines.push("👨‍🏫 بازخورد استاد راهنما:", session.feedback, "");
        if (sessionActions.length) {
          lines.push("📋 اقدامات تعریف‌شده برای جلسه بعد:");
          sessionActions.forEach(a => {
            lines.push(`• ${a.title} [${a.owner ?? "من"}] ${a.done ? "✓" : ""}`);
          });
        }
        navigator.clipboard.writeText(lines.join("\n")).then(() => toast("متن صورت‌جلسه کپی شد"));
      };

      return (
        <div id={`session-${session.id}`} className="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <button
            onClick={onToggle}
            className="flex w-full items-center justify-between gap-3 p-4 text-right hover:bg-slate-50/60 transition"
          >
            <div className="flex items-center gap-3">
              <div className="flex size-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-700 to-indigo-800 text-white font-bold text-sm">
                {toFaDigits(number)}
              </div>
              <div>
                <p className="text-sm md:text-base font-bold text-slate-800">{session.title}</p>
                <p className="text-xs text-slate-400 mt-0.5">
                  {formatJalali(session.date)} · {session.type} · {toFaDigits(sessionActions.length)} اقدام · {toFaDigits(questions.length)} سوال
                </p>
              </div>
            </div>
            <span className={`text-slate-400 transition-transform duration-200 ${expanded ? "rotate-180" : ""}`}>▼</span>
          </button>

          {expanded && (
            <div className="border-t border-slate-100 p-4 md:p-6">
              <div className="grid grid-cols-1 gap-4 md:grid-cols-2">
                <label className="block">
                  <span className="mb-1 block text-xs font-semibold text-slate-500">عنوان جلسه</span>
                  <input
                    value={session.title}
                    onChange={e => updateField({ title: e.target.value })}

    // -------------------------------------------------------------------------
    // ۴. چارچوب و ساختار درختی (Framework)
    // -------------------------------------------------------------------------
    function FrameworkView() {
      const { store, updateStore, toast } = useApp();
      const [newRoot, setNewRoot] = useState("");

      const countNodes = (nodes) => nodes.reduce((acc, n) => acc + 1 + countNodes(n.children || []), 0);
      const countDone = (nodes) => nodes.reduce((acc, n) => acc + (n.done ? 1 : 0) + countDone(n.children || []), 0);

      const total = countNodes(store.framework);
      const done = countDone(store.framework);
      const pct = total ? Math.round((done / total) * 100) : 0;

      const modifyTree = (nodes, path, fn) => {
        if (path.length === 0) return nodes;
        const [head, ...rest] = path;
        return nodes.map((n, idx) => {
          if (idx !== head) return n;
          if (rest.length === 0) return fn(n);
          return { ...n, children: modifyTree(n.children || [], rest, fn) };
        });
      };

      const deleteFromTree = (nodes, path) => {
        if (path.length === 1) return nodes.filter((_, idx) => idx !== path[0]);
        const [head, ...rest] = path;
        return nodes.map((n, idx) => idx === head ? { ...n, children: deleteFromTree(n.children || [], rest) } : n);
      };

      return (
        <div className="space-y-5">
          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="mb-2 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-800">🌿 پیشرفت تکمیل ساختار پایان‌نامه</h3>
              <span className="text-sm font-bold text-indigo-600">{toFaDigits(pct)}٪</span>
            </div>
            <div className="h-2.5 w-full overflow-hidden rounded-full bg-slate-100">
              <div className="h-full rounded-full bg-indigo-600 transition-all" style={{ width: `${pct}%` }} />
            </div>
          </div>

          <div className="flex gap-2">
            <input
              value={newRoot}
              onChange={e => setNewRoot(e.target.value)}
              placeholder="افزودن سرفصل یا بخش اصلی جدید..."
              className="flex-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500"
            />
            <button
              onClick={() => {
                if (!newRoot.trim()) return;
                updateStore(s => ({
                  ...s,
                  framework: [...s.framework, { id: uid(), title: newRoot.trim(), done: false, children: [] }]
                }));
                setNewRoot("");
                toast("بخش جدید اضافه شد");
              }}
              className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
            >
              + افزودن
            </button>
          </div>

          <div className="space-y-3">
            {store.framework.map((node, idx) => (
              <FrameworkNode
                key={node.id}
                node={node}
                path={[idx]}
                depth={0}
                onToggle={(p) => updateStore(s => ({ ...s, framework: modifyTree(s.framework, p, n => ({ ...n, done: !n.done })) }))}
                onAddChild={(p, title) => updateStore(s => ({
                  ...s,
                  framework: modifyTree(s.framework, p, n => ({ ...n, children: [...(n.children || []), { id: uid(), title, done: false, children: [] }] }))
                }))}
                onDelete={(p) => updateStore(s => ({ ...s, framework: deleteFromTree(s.framework, p) }))}
              />
            ))}
          </div>
        </div>
      );
    }

    function FrameworkNode({ node, path, depth, onToggle, onAddChild, onDelete }) {
      const [adding, setAdding] = useState(false);
      const [subTitle, setSubTitle] = useState("");

      return (
        <div
          className={`rounded-2xl border p-3.5 ${depth > 0 ? "border-slate-100 bg-slate-50/70" : "border-slate-200 bg-white shadow-sm"}`}
          style={{ marginRight: depth * 20 }}
        >
          <div className="flex items-center justify-between gap-2">
            <label className="flex items-center gap-2.5 cursor-pointer flex-1">
              <input type="checkbox" checked={node.done} onChange={() => onToggle(path)} className="size-4 accent-indigo-600" />
              <span className={`text-sm font-medium ${node.done ? "line-through text-slate-400" : "text-slate-800"}`}>
                {node.title}
              </span>
            </label>
            <div className="flex items-center gap-2">
              <button onClick={() => setAdding(!adding)} className="text-xs font-medium text-indigo-600 hover:underline">
                + زیربخش
              </button>
              <button onClick={() => onDelete(path)} className="text-rose-400 hover:text-rose-600 text-xs">
                🗑️
              </button>
            </div>
          </div>

          {adding && (
            <div className="mt-3 flex gap-2">
              <input
                autoFocus
                value={subTitle}
                onChange={e => setSubTitle(e.target.value)}
                placeholder="عنوان زیربخش..."
                className="flex-1 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm outline-none"
              />
              <button
                onClick={() => {
                  if (subTitle.trim()) {
                    onAddChild(path, subTitle.trim());
                    setSubTitle("");
                    setAdding(false);
                  }
                }}
                className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs text-white"
              >
                ثبت
              </button>
            </div>
          )}

          {node.children && node.children.length > 0 && (
            <div className="mt-3 space-y-2">
              {node.children.map((ch, idx) => (
                <FrameworkNode
                  key={ch.id}
                  node={ch}
                  path={[...path, idx]}
                  depth={depth + 1}
                  onToggle={onToggle}
                  onAddChild={onAddChild}
                  onDelete={onDelete}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

            <p className="text-sm text-slate-500">ایده‌ها، لینک مقالات و نکات مهم پژوهشی را اینجا ثبت کنید.</p>
            <button
              onClick={() => setOpenNew(!openNew)}
              className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
            >
              + یادداشت جدید
            </button>
          </div>

          {openNew && (
            <div className="rounded-2xl border border-indigo-100 bg-indigo-50/40 p-4 space-y-3">
              <div className="flex gap-2">
                <input
                  value={form.title}
                  onChange={e => setForm({ ...form, title: e.target.value })}
                  placeholder="عنوان یادداشت..."
                  className="flex-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none"
                />
                <select
                  value={form.tag}
                  onChange={e => setForm({ ...form, tag: e.target.value })}
                  className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none"
                >
                  <option>ایده</option>
                  <option>مهم</option>
                  <option>سوال</option>
                  <option>عمومی</option>
                </select>
              </div>
              <textarea
                rows={4}
                value={form.content}
                onChange={e => setForm({ ...form, content: e.target.value })}
                placeholder="متن یادداشت..."
                className="w-full rounded-xl border border-slate-200 bg-white p-3 text-sm outline-none"
              />
              <div className="flex justify-end gap-2">
                <button onClick={() => setOpenNew(false)} className="rounded-lg border px-4 py-1.5 text-sm">انصراف</button>
                <button
                  onClick={() => {
                    if (!form.content.trim()) return;
                    updateStore(s => ({
                      ...s,
                      notes: [{ id: uid(), ...form, pinned: false, updatedAt: new Date().toISOString() }, ...s.notes]
                    }));
                    setForm({ title: "", content: "", tag: "ایده" });
                    setOpenNew(false);
                    toast("یادداشت ذخیره شد");
                  }}
                  className="rounded-lg bg-indigo-600 px-4 py-1.5 text-sm font-medium text-white"
                >
                  ذخیره
                </button>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            {sortedNotes.map(n => (
              <div key={n.id} className={`flex flex-col rounded-2xl border bg-white p-4 shadow-sm ${n.pinned ? "border-amber-300 ring-1 ring-amber-200" : "border-slate-200"}`}>
                <div className="mb-2 flex items-center justify-between">
                  <span className={`rounded-full px-2.5 py-0.5 text-[11px] font-bold ${tagStyles[n.tag] || tagStyles["عمومی"]}`}>
                    {n.tag}
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => updateStore(s => ({
                        ...s,
                        notes: s.notes.map(x => x.id === n.id ? { ...x, pinned: !x.pinned } : x)
                      }))}
                      title="سنجاق کردن"
                      className="text-sm"
                    >
                      {n.pinned ? "📌" : "📍"}
                    </button>
                    <button
                      onClick={() => askConfirm("این یادداشت حذف شود؟", () => updateStore(s => ({ ...s, notes: s.notes.filter(x => x.id !== n.id) })))}
                      className="text-rose-400 hover:text-rose-600 text-xs"
                    >
                      ✖
                    </button>
                  </div>
                </div>
                {n.title && <p className="mb-1 text-sm font-bold text-slate-800">{n.title}</p>}
                <textarea
                  rows={4}
                  value={n.content}
                  onChange={e => updateStore(s => ({
                    ...s,
                    notes: s.notes.map(x => x.id === n.id ? { ...x, content: e.target.value, updatedAt: new Date().toISOString() } : x)
                  }))}
                  className="flex-1 resize-none bg-transparent text-sm leading-6 text-slate-600 outline-none"
                />
                <p className="mt-2 text-[11px] text-slate-400">به‌روزرسانی: {formatJalali(n.updatedAt)}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // ۶. جدول زمانی (Timeline)
    // -------------------------------------------------------------------------
    function TimelineView() {
      const { store, updateStore, toast } = useApp();
      const [openAdd, setOpenAdd] = useState(false);
      const [form, setForm] = useState({ title: "", date: todayIso(), description: "" });
      const sorted = [...store.milestones].sort((a, b) => a.date.localeCompare(b.date));
      const nowIso = todayIso();

      return (
        <div className="space-y-5">
          <div className="flex items-center justify-between">
            <p className="text-sm text-slate-500">مهلت‌ها و نقاط عطف کلیدی پایان‌نامه را در تقویم شمسی مدیریت کنید.</p>
            <button
              onClick={() => setOpenAdd(!openAdd)}
              className="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
            >
              + رویداد جدید
            </button>
          </div>

          {openAdd && (
            <div className="rounded-2xl border border-indigo-100 bg-indigo-50/40 p-4 space-y-3">
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                <input
                  value={form.title}
                  onChange={e => setForm({ ...form, title: e.target.value })}
                  placeholder="عنوان رویداد (مثلاً تحویل فصل سوم)..."
                  className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none"
                />
                <JalaliDatePicker value={form.date} onChange={d => setForm({ ...form, date: d })} />
              </div>
              <textarea
                rows={2}
                value={form.description}
                onChange={e => setForm({ ...form, description: e.target.value })}
                placeholder="توضیحات تکمیلی..."
                className="w-full rounded-xl border border-slate-200 bg-white p-2.5 text-sm outline-none"
              />
              <div className="flex justify-end gap-2">
                <button onClick={() => setOpenAdd(false)} className="rounded-lg border px-4 py-1.5 text-sm">انصراف</button>
                <button
                  onClick={() => {
                    if (!form.title.trim()) return;
                    updateStore(s => ({
                      ...s,
                      milestones: [...s.milestones, { id: uid(), ...form, done: false }]
                    }));
                    setForm({ title: "", date: todayIso(), description: "" });
                    setOpenAdd(false);
                    toast("رویداد ثبت شد");
                  }}
                  className="rounded-lg bg-indigo-600 px-4 py-1.5 text-sm font-medium text-white"
                >
                  ثبت رویداد
                </button>
              </div>
            </div>
          )}

          <ol className="relative mr-3 space-y-4 border-r-2 border-slate-200 pr-6">
            {sorted.map(ms => {
              const isPast = ms.date < nowIso;
              return (
                <li key={ms.id} className="relative">
                  <span
                    className={`absolute -right-[33px] top-1 flex size-5 items-center justify-center rounded-full border-2 border-white text-[10px] text-white ${
                      ms.done ? "bg-emerald-500" : isPast ? "bg-rose-500" : "bg-indigo-500"
                    }`}
                  >
                    {ms.done ? "✓" : ""}
                  </span>
                  <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <p className={`text-sm font-bold ${ms.done ? "line-through text-slate-400" : "text-slate-800"}`}>{ms.title}</p>
                      <p className="text-xs text-slate-400 mt-0.5">
                        {formatJalali(ms.date)}
                        {!ms.done && isPast && <span className="mr-2 text-rose-500 font-bold">· سررسید گذشته</span>}
                      </p>
                      {ms.description && <p className="mt-1.5 text-xs text-slate-600">{ms.description}</p>}
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => updateStore(s => ({
                          ...s,
                          milestones: s.milestones.map(x => x.id === ms.id ? { ...x, done: !x.done } : x)
                        }))}
                        className="rounded-lg border border-slate-200 px-3 py-1 text-xs font-medium text-slate-600 hover:bg-slate-50"
                      >
                        {ms.done ? "بازگردانی" : "تکمیل شد"}
                      </button>
                      <button
                        onClick={() => updateStore(s => ({ ...s, milestones: s.milestones.filter(x => x.id !== ms.id) }))}
                        className="text-rose-400 hover:text-rose-600 text-sm"
                      >
                        🗑️
                      </button>
                    </div>
                  </div>
                </li>
              );
            })}
          </ol>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // ۷. آماده‌سازی دفاع (Defense)
    // -------------------------------------------------------------------------
    function DefenseView() {
